<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Crossword</title>
    <style>
        :root {
            /* Smooth, cohesive dark theme */
            --bg-gray: #232428; 
            --sidebar-bg: #2b2d31;
            
            /* Typography */
            --text-main: #f2f3f5; 
            --text-muted: #949ba4;
            --border-subtle: #3f4147;
            
            /* Crossword specific */
            --box-white: #ffffff;
            --black-square: #000000; 
            --highlight-yellow: #fef08a;
            
            /* Buttons */
            --btn-bg: #1e1e20;
            --btn-text: #f4f4f5;
            --danger-red: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-gray);
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
        }

        .main-layout {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        /* Dark Theme Sidebars - No more eye strain */
        .clue-sidebar {
            flex: 1;
            max-width: 350px;
            background-color: var(--sidebar-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); 
            max-height: 80vh;
            overflow-y: auto;
        }

        .clue-sidebar h2 {
            color: var(--text-main);
            font-size: 1.1em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 2px solid var(--border-subtle);
            padding-bottom: 12px;
            margin-top: 0;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 5;
        }

        .clue-item {
            display: flex;
            margin-bottom: 18px;
            gap: 15px;
            align-items: flex-start;
        }

        .clue-num {
            font-weight: 700;
            color: var(--text-main);
            min-width: 24px;
            text-align: right;
            font-size: 1em;
            padding-top: 2px;
        }

        .clue-text {
            flex: 1;
            min-height: 24px;
            border-bottom: 1px solid transparent;
            outline: none;
            padding-bottom: 2px;
            font-size: 0.95em;
            color: var(--text-muted);
            line-height: 1.5;
            transition: all 0.2s;
        }

        .clue-text:focus { 
            color: var(--text-main);
            border-bottom: 1px solid var(--text-muted); 
        }
        
        .clue-text:empty::before { 
            content: "Paste clue here..."; 
            color: var(--border-subtle);
            font-style: italic;
        }

        /* Crossword Grid - Crisp White/Black */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 44px);
            grid-template-rows: repeat(13, 44px);
            background-color: var(--black-square);
            border: 4px solid var(--black-square); 
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            width: fit-content;
            height: fit-content;
            flex-shrink: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .cell {
            width: 44px;
            height: 44px;
            box-sizing: border-box;
            border: 1px solid #555; 
            position: relative;
        }

        .cell.black { 
            background-color: var(--black-square); 
            border-color: var(--black-square); 
        }

        .cell.answer {
            background-color: var(--box-white);
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #111; /* Dark text inside the white puzzle squares */
            text-transform: uppercase;
            outline: none;
            padding: 0;
            margin: 0;
            font-family: inherit;
        }

        .cell input:focus { 
            background-color: var(--highlight-yellow); 
        }

        .cell-label {
            position: absolute;
            top: 3px;
            left: 4px;
            font-size: 11px;
            color: #333;
            font-weight: 700;
            pointer-events: none;
        }

        /* Buttons */
        .controls {
            margin-top: 40px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--border-subtle);
            padding: 10px 24px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover { 
            background-color: #3f3f46; 
        }

        button.danger { 
            background-color: var(--btn-bg);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
        }

        button.danger:hover { 
            background-color: var(--danger-red); 
            color: var(--box-white);
        }

        /* Custom Scrollbar to match dark theme */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { 
            background: var(--border-subtle); 
            border-radius: 4px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    </style>
</head>
<body>

    <div class="main-layout">
        <div class="clue-sidebar">
            <h2>Across</h2>
            <div id="across-list"></div>
        </div>

        <div id="grid" class="grid-container"></div>

        <div class="clue-sidebar">
            <h2>Down</h2>
            <div id="down-list"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="saveProgress()">Save Progress</button>
        <button class="danger" onclick="resetAll()">Clear All</button>
    </div>

    <script>
        const GRID_SIZE = 13;
        
        // E = Empty (White), B = Black
        const gridData = [
            'EEEEEEEEEBEBE',
            'EBEBEBEBEBEBE',
            'EBEBEBEEEEEBE',
            'EEEBBBEBEBBBE',
            'EBEBEBEBBEEEE',
            'BBEBEBBEBBEBE',
            'BEEEEEEEEBEBE',
            'BEBBEBBEBBEBB',
            'EEEEBBBEBBEEE',
            'BEBEBBEEEEBBE',
            'BEBEBBBEBEBBE',
            'EEEEEBEEEEEEE',
            'BBBEBBBBBEBBE'
        ];

        const labels = {
            '0,0': 1, '0,2': 2, '0,4': 3, '0,6': 4, '0,8': 5, '0,10': 6, '0,12': 7,
            '2,6': 8, '3,0': 9, '4,4': 10, '4,9': 11, '4,10': 12, '5,7': 13,
            '6,1': 14, '8,0': 15, '8,3': 16, '8,10': 17, '8,12': 18, 
            '9,6': 19, '9,9': 20, '11,0': 21, '11,6': 22
        };

        const acrossNums = [1, 8, 9, 11, 14, 15, 17, 19, 21, 22];
        const downNums = [1, 2, 3, 4, 5, 6, 7, 10, 12, 13, 16, 18, 20];

        function init() {
            const gridEl = document.getElementById('grid');
            const acrossEl = document.getElementById('across-list');
            const downEl = document.getElementById('down-list');

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (gridData[r][c] === 'B') {
                        cell.classList.add('black');
                    } else {
                        cell.classList.add('answer');
                        const input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.row = r;
                        input.dataset.col = c;
                        input.id = `input-${r}-${c}`;
                        
                        if (labels[`${r},${c}`]) {
                            const span = document.createElement('span');
                            span.className = 'cell-label';
                            span.innerText = labels[`${r},${c}`];
                            cell.appendChild(span);
                        }
                        
                        input.addEventListener('input', () => {
                            saveProgress();
                            if(input.value) moveFocus(r, c, 1, 0); 
                        });
                        input.addEventListener('keydown', handleNav);
                        cell.appendChild(input);
                    }
                    gridEl.appendChild(cell);
                }
            }

            acrossNums.forEach(num => acrossEl.appendChild(createClueItem('across', num)));
            downNums.sort((a,b)=>a-b).forEach(num => downEl.appendChild(createClueItem('down', num)));

            loadProgress();
        }

        function createClueItem(type, num) {
            const div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `
                <div class="clue-num">${num}</div>
                <div class="clue-text" contenteditable="true" id="clue-${type}-${num}"></div>
            `;
            div.querySelector('.clue-text').addEventListener('input', saveProgress);
            return div;
        }

        function handleNav(e) {
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            if (e.key === 'ArrowRight') moveFocus(r, c, 1, 0);
            if (e.key === 'ArrowLeft') moveFocus(r, c, -1, 0);
            if (e.key === 'ArrowDown') moveFocus(r, c, 0, 1);
            if (e.key === 'ArrowUp') moveFocus(r, c, 0, -1);
            if (e.key === 'Backspace' && !e.target.value) moveFocus(r, c, -1, 0);
        }

        function moveFocus(r, c, dx, dy) {
            let nr = r + dy, nc = c + dx;
            const next = document.getElementById(`input-${nr}-${nc}`);
            if (next) next.focus();
        }

        function saveProgress() {
            const data = { cells: {}, clues: {} };
            document.querySelectorAll('.cell input').forEach(input => {
                if (input.value) data.cells[input.id] = input.value;
            });
            document.querySelectorAll('.clue-text').forEach(clue => {
                if (clue.innerText) data.clues[clue.id] = clue.innerText;
            });
            localStorage.setItem('crossword_v6', JSON.stringify(data));
        }

        function loadProgress() {
            const saved = localStorage.getItem('crossword_v6');
            if (!saved) return;
            const data = JSON.parse(saved);
            for (const id in data.cells) {
                const el = document.getElementById(id);
                if (el) el.value = data.cells[id];
            }
            for (const id in data.clues) {
                const el = document.getElementById(id);
                if (el) el.innerText = data.clues[id];
            }
        }

        function resetAll() {
            if (confirm("Clear all answers and clues?")) {
                localStorage.removeItem('crossword_v6');
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
