<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Dark Crossword</title>
    <style>
        :root {
            --deep-charcoal: #121212;
            --gunmetal-grey: #2a2e35;
            --steel-blue: #4682b4; /* Used only once for grid border */
            --mid-grey: #6c757d;
            --text-white: #ffffff;
            --text-dim: #b0b0b0;
            --danger-red: #ff3333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--deep-charcoal);
            color: var(--text-white);
            margin: 0;
            padding: 40px 20px;
        }

        .main-layout {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            justify-content: center;
        }

        /* Sidebars */
        .clue-sidebar {
            flex: 1;
            background-color: var(--gunmetal-grey);
            padding: 20px;
            border-radius: 4px;
            border: 1px solid #444;
            max-height: 85vh;
            overflow-y: auto;
        }

        .clue-sidebar h2 {
            color: var(--text-white);
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--text-white);
            padding-bottom: 10px;
            margin-top: 0;
            position: sticky;
            top: 0;
            background: var(--gunmetal-grey);
            z-index: 5;
        }

        .clue-item {
            display: flex;
            margin-bottom: 15px;
            gap: 12px;
        }

        .clue-num {
            font-weight: 800;
            color: var(--text-white);
            min-width: 25px;
        }

        .clue-text {
            flex: 1;
            min-height: 20px;
            border-bottom: 1px solid #3d424a;
            outline: none;
            padding-bottom: 4px;
            font-size: 0.95em;
            color: var(--text-dim);
            line-height: 1.4;
        }

        .clue-text:focus { 
            border-bottom: 1px solid var(--text-white); 
            color: var(--text-white);
        }
        
        .clue-text:empty::before { content: "Paste clue..."; opacity: 0.3; }

        /* Grid - The "One instance" of blue is here */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(13, 42px);
            grid-template-rows: repeat(13, 42px);
            background-color: var(--gunmetal-grey);
            border: 2px solid var(--steel-blue); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .cell {
            width: 42px;
            height: 42px;
            box-sizing: border-box;
            border: 1px solid #3d424a;
            position: relative;
        }

        .cell.black { background-color: #000; border-color: #000; }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-white);
            text-transform: uppercase;
            outline: none;
            padding: 0;
            margin: 0;
        }

        .cell input:focus { background-color: rgba(255, 255, 255, 0.1); }

        .cell-label {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 9px;
            color: var(--text-white);
            font-weight: bold;
            pointer-events: none;
            opacity: 0.8;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: transparent;
            color: var(--text-dim);
            border: 1px solid var(--mid-grey);
            padding: 8px 20px;
            cursor: pointer;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        button:hover { 
            background-color: var(--text-white); 
            color: var(--deep-charcoal);
            border-color: var(--text-white);
        }

        button.danger:hover { 
            background-color: var(--danger-red); 
            border-color: var(--danger-red);
            color: white;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--deep-charcoal); }
        ::-webkit-scrollbar-thumb { background: #444; }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="clue-sidebar">
            <h2>Across</h2>
            <div id="across-list"></div>
        </div>

        <div id="grid" class="grid-container"></div>

        <div class="clue-sidebar">
            <h2>Down</h2>
            <div id="down-list"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="saveProgress()">Save Progress</button>
        <button class="danger" onclick="resetAll()">Clear All</button>
    </div>

    <script>
        const GRID_SIZE = 13;
        const gridMap = [
            'WWWWWWWWWBWBW',
            'WBWBWBWBWBWBW',
            'WBWBWBWWWWWBW',
            'WWWBBBWBBBBBW',
            'WBWBWBWBBWWWW',
            'BBWBWBWBWBBWW',
            'BWWWWWWWWWBWB',
            'BWBBWBBWBBWBB',
            'WWWWB BB W BB WWW'.replace(/\s/g, ''),
            'BW B W BB WWW BB W'.replace(/\s/g, ''),
            'BW B W BB W BB W BB W'.replace(/\s/g, ''),
            'WWWWW B WWWWWWW'.replace(/\s/g, ''),
            'BBBW B BBBB B W BB W'.replace(/\s/g, '')
        ];

        const labels = {
            '0,0': 1, '0,2': 2, '0,4': 3, '0,6': 4, '0,8': 5, '0,10': 6, '0,12': 7,
            '2,6': 8, '3,0': 9, '4,4': 10, '4,9': 11, '4,10': 12, '5,7': 13,
            '6,1': 14, '8,0': 15, '8,3': 16, '8,10': 17, '8,12': 18, 
            '9,6': 19, '9,9': 20, '11,0': 21, '11,6': 22
        };

        const acrossNums = [1, 8, 9, 11, 14, 15, 17, 19, 21, 22];
        const downNums = [1, 2, 3, 4, 5, 6, 7, 10, 12, 13, 16, 18, 20];

        function init() {
            const gridEl = document.getElementById('grid');
            const acrossEl = document.getElementById('across-list');
            const downEl = document.getElementById('down-list');

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (gridMap[r][c] === 'B') {
                        cell.classList.add('black');
                    } else {
                        const input = document.createElement('input');
                        input.maxLength = 1;
                        input.dataset.row = r;
                        input.dataset.col = c;
                        input.id = `input-${r}-${c}`;
                        
                        if (labels[`${r},${c}`]) {
                            const span = document.createElement('span');
                            span.className = 'cell-label';
                            span.innerText = labels[`${r},${c}`];
                            cell.appendChild(span);
                        }
                        
                        input.addEventListener('input', () => {
                            saveProgress();
                            moveFocus(r, c, 1, 0); 
                        });
                        input.addEventListener('keydown', handleNav);
                        cell.appendChild(input);
                    }
                    gridEl.appendChild(cell);
                }
            }

            acrossNums.forEach(num => acrossEl.appendChild(createClueItem('across', num)));
            downNums.sort((a,b)=>a-b).forEach(num => downEl.appendChild(createClueItem('down', num)));

            loadProgress();
        }

        function createClueItem(type, num) {
            const div = document.createElement('div');
            div.className = 'clue-item';
            div.innerHTML = `
                <div class="clue-num">${num}</div>
                <div class="clue-text" contenteditable="true" id="clue-${type}-${num}"></div>
            `;
            div.querySelector('.clue-text').addEventListener('input', saveProgress);
            return div;
        }

        function handleNav(e) {
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            if (e.key === 'ArrowRight') moveFocus(r, c, 1, 0);
            if (e.key === 'ArrowLeft') moveFocus(r, c, -1, 0);
            if (e.key === 'ArrowDown') moveFocus(r, c, 0, 1);
            if (e.key === 'ArrowUp') moveFocus(r, c, 0, -1);
            if (e.key === 'Backspace' && !e.target.value) moveFocus(r, c, -1, 0);
        }

        function moveFocus(r, c, dx, dy) {
            let nr = r + dy, nc = c + dx;
            const next = document.getElementById(`input-${nr}-${nc}`);
            if (next) next.focus();
        }

        function saveProgress() {
            const data = { cells: {}, clues: {} };
            document.querySelectorAll('.cell input').forEach(input => {
                if (input.value) data.cells[input.id] = input.value;
            });
            document.querySelectorAll('.clue-text').forEach(clue => {
                if (clue.innerText) data.clues[clue.id] = clue.innerText;
            });
            localStorage.setItem('crossword_minimal_v1', JSON.stringify(data));
        }

        function loadProgress() {
            const saved = localStorage.getItem('crossword_minimal_v1');
            if (!saved) return;
            const data = JSON.parse(saved);
            for (const id in data.cells) {
                const el = document.getElementById(id);
                if (el) el.value = data.cells[id];
            }
            for (const id in data.clues) {
                const el = document.getElementById(id);
                if (el) el.innerText = data.clues[id];
            }
        }

        function resetAll() {
            if (confirm("Clear all answers and clues?")) {
                localStorage.removeItem('crossword_minimal_v1');
                location.reload();
            }
        }

        init();
    </script>
</body>
</html>
